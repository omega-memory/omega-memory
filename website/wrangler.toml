name = "omega-dashboard"
main = "dist/_worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[site]
bucket = "dist/client"

[[d1_databases]]
binding = "DB"
database_name = "omega-prod"
database_id = "" # Set via `wrangler d1 create omega-prod`

[vars]
AUTH_SECRET = "" # Set via `wrangler secret put AUTH_SECRET`
ANTHROPIC_API_KEY = "" # Set via `wrangler secret put ANTHROPIC_API_KEY`
STRIPE_SECRET_KEY = ""
STRIPE_WEBHOOK_SECRET = ""

# Local development overrides
[env.dev]
[[env.dev.d1_databases]]
binding = "DB"
database_name = "omega-dev"
database_id = "" # Set via `wrangler d1 create omega-dev`

[env.dev.vars]
AUTH_SECRET = "dev-secret-change-me"
