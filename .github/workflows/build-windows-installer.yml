name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "omega-memory version the installer installs"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a release version (X.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The installer pip-installs this exact version on the user's PC, so do
      # not publish it before PyPI's index lists the version.
      - name: Wait for the release on PyPI
        timeout-minutes: 20
        shell: bash
        run: python installer/wait_for_pypi.py "${{ steps.version.outputs.version }}"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Prepare embedded Python
        working-directory: installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build\python | Out-Null
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip" -OutFile build\python.zip
          Expand-Archive build\python.zip -DestinationPath build\python -Force
          Remove-Item build\python.zip
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile build\get-pip.py

      - name: Build installer
        working-directory: installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.version }}" omega-setup.iss'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMEGA-Memory-${{ steps.version.outputs.version }}-Windows
          path: installer/dist/omega-setup.exe

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/omega-setup.exe
