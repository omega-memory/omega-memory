name: Build macOS Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "omega-memory version to package"
        required: true
        default: "1.5.4"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        working-directory: installer
        run: ./build-macos-pkg.sh "${{ steps.version.outputs.version }}"

      - name: Verify packaged omega version
        run: |
          expected="${{ steps.version.outputs.version }}"
          payload=installer/build/macos/payload
          # The Apple Silicon Python runs natively. The Intel one runs under
          # Rosetta when the runner has it; otherwise read its package metadata.
          for arch in arm64 x86_64; do
            python="$payload/python-$arch/bin/python3"
            if [ "$arch" = arm64 ] || arch -x86_64 /usr/bin/true 2>/dev/null; then
              actual="$(arch "-$arch" "$python" -c 'import omega, onnxruntime; print(omega.__version__)')"
            else
              actual="$(sed -n 's/^Version: //p' "$payload"/python-$arch/lib/python3.12/site-packages/omega_memory-*.dist-info/METADATA)"
            fi
            if [ "$actual" != "$expected" ]; then
              echo "::error::$arch payload has omega $actual, expected $expected"
              exit 1
            fi
            echo "$arch: omega $actual"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMEGA-Memory-${{ steps.version.outputs.version }}-macOS
          path: installer/build/macos/dist/OMEGA-Memory.pkg

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/build/macos/dist/OMEGA-Memory.pkg
